name: pitaka
description: "A new Flutter project."
publish_to: 'none'

version: 0.2.0+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # State management
  flutter_riverpod: ^2.5.1

  # Formatting (currency, dates)
  intl: ^0.19.0
  logger: ^2.7.0
  package_info_plus: ^10.2.1
  dio: ^5.11.0
  open_filex: ^4.7.0
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/pitaka-icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icons/institutions/
    - assets/icons/pitaka-icon.png