name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Release APK
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checking out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setting up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Installing dependencies
        run: flutter pub get

      - name: Resolving release version
        id: release
        shell: bash
        run: |
          pubspec_version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)
          if [[ -z "$pubspec_version" ]]; then
            echo "Could not find a version in pubspec.yaml" >&2
            exit 1
          fi

          semver="${pubspec_version%%+*}"
          tag_name="v${semver}"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag_name}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checking code formatting
        if: steps.release.outputs.should_release == 'true'
        run: dart format --set-exit-if-changed .

      - name: Running static analysis
        if: steps.release.outputs.should_release == 'true'
        run: flutter analyze

      - name: Running tests
        if: steps.release.outputs.should_release == 'true'
        run: flutter test

      - name: Building release APK
        if: steps.release.outputs.should_release == 'true'
        run: flutter build apk --release

      - name: Creating GitHub Release
        if: steps.release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
